<!DOCTYPE html>
<html>
<head>
    <title>Flask Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        h2 {
            color: #333;
        }

        .result {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Flask Calculator</h2>

    <form method="POST">
        <input type="number" step="any" name="num1" placeholder="Enter First Number" required>

        <input type="number" step="any" name="num2" placeholder="Enter Second Number" required>

        <select name="operation">
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (*)</option>
            <option value="divide">Division (/)</option>
        </select>

        <button type="submit">Calculate</button>
    </form>

    {% if result is not none %}
        <p class="result">Result: {{ result }}</p>
    {% endif %}
</div>

</body>
</html>
